[project]
name = "bot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=23.1.0",
    "fastapi[standard]>=0.162.5",
    "pyjwt>=2.9.0",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
    "stomp-py>=8.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Layout src/: `auth` y `bot` quedan importables como paquetes de primer nivel.
[tool.hatch.build.targets.wheel]
packages = ["src/auth", "src/bot"]
